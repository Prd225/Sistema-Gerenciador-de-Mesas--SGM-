services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgm
      POSTGRES_PASSWORD: sgm_secret
      POSTGRES_DB: sgm_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgm -d sgm_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web para ver o banco. Opcional: docker compose --profile tools up -d
  dbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '8080:8978'
    volumes:
      - dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  dbeaver_data:
