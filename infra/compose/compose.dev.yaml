services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sgm
      POSTGRES_PASSWORD: sgm_secret
      POSTGRES_DB: sgm_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sgm -d sgm_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
