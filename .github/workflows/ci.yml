name: CI

on:
  push:
    branches: [next, master]
  pull_request:
    branches: [next, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatação, lint, tipos, fronteiras, testes e build
        run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem Docker com cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          load: true
          tags: sistema-gerenciador-de-mesas-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir compose E2E
        run: docker compose -f infra/compose/compose.e2e.yaml up -d --wait

      - name: Executar testes Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
        run: npm run test:e2e

      - name: Upload de traces do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

      - name: Encerrar containers E2E
        if: always()
        run: docker compose -f infra/compose/compose.e2e.yaml down -v

  publish:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair SHA curto
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build e publish da imagem no GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository }}:next
          cache-from: type=gha
          cache-to: type=gha,mode=max
